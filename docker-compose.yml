services:
  pact-broker-db:
    image: postgres:16
    container_name: marketcurrency-pact-broker-db
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 10s
      timeout: 5s
      retries: 10

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: marketcurrency-pact-broker
    depends_on:
      pact-broker-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: pact-broker-db
      PACT_BROKER_DATABASE_NAME: pact
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: pact
      PACT_BROKER_LOG_LEVEL: INFO
    ports:
      - "9292:9292"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: zookeeper:3.9
    container_name: marketcurrency-zookeeper
    ports:
      - "2181:2181"
      - "7000:7000"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,stat,mntr,conf,isro
      ZOO_CFG_EXTRA: |
        metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider
        metricsProvider.httpHost=0.0.0.0
        metricsProvider.httpPort=7000
        metricsProvider.exportJvmInfo=true
    healthcheck:
      test: ["CMD", "sh", "-c", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: marketcurrency-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: marketcurrency-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: marketcurrency-zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  provider-1:
    build:
      context: ./currency-rate-provider
    container_name: marketcurrency-provider-1
    depends_on:
      zookeeper:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SERVER_PORT: 8080
    ports:
      - "18080:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  provider-2:
    build:
      context: ./currency-rate-provider
    container_name: marketcurrency-provider-2
    depends_on:
      zookeeper:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SERVER_PORT: 8080
    ports:
      - "18082:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  rate-printer:
    build:
      context: ./rate-printer
    container_name: marketcurrency-rate-printer
    depends_on:
      zookeeper:
        condition: service_healthy
      provider-1:
        condition: service_healthy
      provider-2:
        condition: service_healthy
      zipkin:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SERVER_PORT: 8081
    ports:
      - "18081:8081"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
