spring:
  application:
    name: rate-printer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  cloud:
    zookeeper:
      connect-string: ${ZOOKEEPER_CONNECT_STRING:localhost:2181}
      discovery:
        enabled: true
        register: false

server:
  port: 8081
  shutdown: graceful

provider:
  service-id: currency-rate-provider
  rpc-path: /rpc
  connect-timeout-ms: 1000
  read-timeout-ms: 1000
  discovery-refresh-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        provider.call.latency: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        provider.call.latency: 0.5,0.95,0.99

logging:
  level:
    root: INFO
