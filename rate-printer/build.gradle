plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'au.com.dius.pact' version '4.4.5'
}

group = 'com.marketcurrency.api'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
	implementation 'org.springframework.cloud:spring-cloud-starter-zookeeper-discovery'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'au.com.dius.pact.consumer:junit5:4.4.5'
	testImplementation 'io.micrometer:micrometer-core'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'pact.rootDir', "$buildDir/pacts"
}

tasks.register('publishPactsToBroker') {
	group = 'verification'
	description = 'Publishes generated Pact files from build/pacts to Pact Broker'
	dependsOn tasks.test
	dependsOn tasks.pactPublish

	doFirst {
		if (!System.getenv('PACT_BROKER_BASE_URL')) {
			logger.lifecycle('PACT_BROKER_BASE_URL is not set, using default http://localhost:9292')
		}
	}
}

pact {
	publish {
		pactBrokerUrl = System.getenv('PACT_BROKER_BASE_URL') ?: 'http://localhost:9292'
		pactDirectory = "$buildDir/pacts"
		consumerVersion = System.getenv('PACT_CONSUMER_VERSION') ?: project.version.toString()
		tags = [System.getenv('PACT_CONSUMER_TAG') ?: 'dev']
	}
}
