spring:
  application:
    name: currency-rate-provider
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    zookeeper:
      connect-string: ${ZOOKEEPER_CONNECT_STRING:localhost:2181}
      discovery:
        enabled: true
        register: true

server:
  shutdown: graceful
  http2:
    enabled: true
  tomcat:
    accept-count: 1000
    max-connections: 10000
    connection-timeout: 5s
    keep-alive-timeout: 60s
    max-keep-alive-requests: 1000
    threads:
      max: 200
      min-spare: 20

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        rpc.latency: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        rpc.latency: 0.5,0.95,0.99

rate:
  base-rate: 90.0
  daily-amplitude: 1.2
  daily-phase-shift: 0.7
  local-amplitude: 0.4
  micro-amplitude: 0.03
  seed: 1337
  clamp-padding: 5.0

logging:
  level:
    root: INFO
